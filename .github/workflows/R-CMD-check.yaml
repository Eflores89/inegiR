name: R-CMD-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r: release
          - os: windows-latest
            r: release
          - os: macos-latest
            r: release
          - os: ubuntu-latest
            r: devel
    env:
      R_KEEP_PKG_SOURCE: yes
      TZ: America/Mexico_City
      _R_CHECK_CRAN_INCOMING_: false
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
      _R_CHECK_FORCE_SUGGESTS_: false
      # Tests mock HTTP and need no real provider token.
      INEGI_TOKEN: ""
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--no-manual")'
          error-on: '"note"'
          upload-results: 'true'

  cran-readiness:
    runs-on: ubuntu-latest
    env:
      TZ: America/Mexico_City
      _R_CHECK_CRAN_INCOMING_: "true"
      _R_CHECK_CRAN_INCOMING_REMOTE_: "true"
      _R_CHECK_FORCE_SUGGESTS_: "true"
      INEGI_TOKEN: ""
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install documentation validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes tidy pandoc
          tidy --version
          pandoc --version
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          # CRAN reports the archived-package status as an incoming NOTE.
          # Keep it visible for the registered maintainer's reactivation request.
          error-on: '"warning"'
          upload-results: 'true'
